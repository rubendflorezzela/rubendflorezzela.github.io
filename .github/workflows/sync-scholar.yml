name: Sync Google Scholar metrics

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 11:23 UTC (06:23 in Peru).
    - cron: '23 11 * * 1'

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch Google Scholar metrics
        env:
          SCHOLAR_ID: Xf8JgfsAAAAJ
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python google_scholar_crawler/crawler.py

      - name: Commit updated metrics
        run: |
          if git diff --quiet -- data/scholar_stats.json; then
            echo "No Scholar metric changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/scholar_stats.json
            git commit -m "chore: sync Google Scholar metrics"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
