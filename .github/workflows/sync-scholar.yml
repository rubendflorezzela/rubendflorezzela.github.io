name: Sync Google Scholar metrics

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 11:23 UTC (06:23 in Peru). Off the top of the hour to reduce scheduler congestion.
    - cron: '23 11 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

# Share the Pages concurrency group with the normal deployment workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install crawler dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Google Scholar metrics
        env:
          SCHOLAR_ID: Xf8JgfsAAAAJ
        run: python google_scholar_crawler/crawler.py

      - name: Commit updated metrics
        run: |
          if git diff --quiet -- data/scholar_stats.json; then
            echo "No Scholar metric changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/scholar_stats.json
            git commit -m "chore: sync Google Scholar metrics"
            git push
          fi

      # Deploy in the same workflow. Commits pushed with GITHUB_TOKEN do not
      # trigger a second workflow/Pages build, so relying on static.yml here
      # would leave the public site one sync behind.
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
